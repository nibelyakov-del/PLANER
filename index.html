/* ===== Плитка «Идеи и мысли»: подплитки = свои категории, внутри раздельные заметки ===== */
const notesOf=k=>S.notes.filter(n=>n.cat===k).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
const noteFull=n=>n.one?(n.text||''):((n.title||'')+(n.text?'\n'+n.text:''));
const noteLines=n=>{const l=noteFull(n).split('\n');const t=(l.shift()||'').trim();return{t,r:l.join('\n').trim()}};
const defNoteCat=()=>S.notecats.find(c=>c.def);
function notesContent(k){
  return `<button class="btn primary block" data-act="noteNew" data-cat="${esc(k)}">${ic('plus',13,2.2)} Добавить</button>
    ${notesOf(k).map(n=>{const q=noteLines(n);return `<button class="ncard" data-act="noteEdit" data-id="${n.id}"><b>${esc(q.t)}</b>${q.r?`<div class="ntx">${esc(q.r)}</div>`:''}<small>${n.at?fmtShort(n.at.slice(0,10)):''}</small></button>`}).join('')||'<div class="empty">Здесь пока нет мыслей.</div>'}`;
}
SUBDEF.notes={tile:'notes',coll:'notecats',noun:'Категория',addLabel:'Новая категория',ph:'Например: Музыка, Бизнес, Жизнь',
  emptyTitle:'Мыслей пока нет.',emptyText:'Потяни вниз или нажми «Добавить мысль».',colorHint:'',
  top:()=>`<button class="btn primary block" data-act="noteNew" data-cat="">${ic('plus',13,2.2)} Добавить мысль</button>`,
  badge:k=>String(notesOf(k).length),
  preview:k=>notesOf(k).slice(0,12).map(n=>({t:noteLines(n).t})),
  content:notesContent,
  blockDelete:k=>S.notes.some(n=>n.cat===k)||!!(S.notecats.find(c=>c.id===k)||{}).def,blockMsg:'В категории есть мысли или она по умолчанию.'};
TILES.push({id:'notes',title:'Идеи и мысли',meta:()=>S.notes.length?S.notes.length+' шт.':'',render:m=>subsRender('notes',m)});
function noteCatSel(id,value,attrs){
  return `<select id="${id}" ${attrs}>${S.notecats.map(c=>`<option value="${c.id}"${c.id===value?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
}
acts.noteNew=el=>{
  const cat=el&&el.dataset&&el.dataset.cat||ui.sub.notes||'';
  ui.drafts['nn-cat']=S.notecats.some(c=>c.id===cat)?cat:(defNoteCat()||{}).id||'';
  openModal({type:'noteNew'});
};
MODALS.noteNew=()=>{
  const fid='nn';
  return `<h3>Новая мысль</h3>
  <form id="${fid}" data-submit="addNote" style="display:flex;flex-direction:column;gap:12px">
    ${fld(fid,'text',{type:'textarea',ph:'Мысль. Первая строка будет заголовком',req:1,af:1})}
    ${S.notecats.length?`<label class="l">Категория<select id="${fid}-cat" name="cat" data-draft>${S.notecats.map(c=>`<option value="${c.id}"${c.id===ui.drafts['nn-cat']?' selected':''}>${esc(c.name)}${c.def?' (по умолчанию)':''}</option>`).join('')}</select></label>`:''}
    <div class="fr"><button class="btn primary">Добавить</button><button type="button" class="btn" data-act="mclose">Отмена</button></div></form>`;
};
forms.addNote=(f,fd)=>{
  const text=(fd.text||'').trim();if(!text)return;
  let cat=fd.cat;
  if(!cat||!S.notecats.some(c=>c.id===cat)){
    let d=defNoteCat();
    if(!d){d={id:uid(),name:'Общее',color:PALETTE[0],def:1,created:0};store.put('notecats',d)}
    cat=d.id;
  }
  store.put('notes',{id:uid(),cat,text,one:1,at:new Date().toISOString()});
  clearDrafts('nn');closeModal();
};
acts.noteEdit=el=>openModal({type:'noteEdit',id:el.dataset.id});
MODALS.noteEdit=m=>{
  const n=S.notes.find(x=>x.id===m.id);if(!n)return '<h3>Не найдено</h3>';
  const a=`data-chg="noteField" data-id="${n.id}"`;
  return `<h3>Мысль</h3>
  <textarea id="ne-${n.id}-x" ${a} data-f="text" data-af style="min-height:180px;font-size:15px" placeholder="Первая строка будет заголовком">${esc(noteFull(n))}</textarea>
  <label class="l">Категория${noteCatSel('ne-'+n.id+'-c',n.cat,`data-chg="noteCat" data-id="${n.id}"`)}</label>
  <div class="fr" style="justify-content:space-between"><button class="btn" data-act="mclose">Готово</button>${delBtn('note-'+n.id,'noteDel','data-id="'+n.id+'"')}</div>`;
};
chg.noteField=el=>{const v=el.value.trim();if(!v)return;store.upd('notes',el.dataset.id,n=>{n.text=v;n.one=1;delete n.title})};
chg.noteCat=el=>{if(S.notecats.some(c=>c.id===el.value))store.upd('notes',el.dataset.id,n=>{n.cat=el.value})};
acts.noteDel=el=>ask('note-'+el.dataset.id,()=>{store.del('notes',el.dataset.id);closeModal()});

/* ===== Плитка «Дни рождения» ===== */
const leapY=y=>(y%4===0&&y%100!==0)||y%400===0;
function bdDate(b,y){let [mm,dd]=b.md.split('-').map(Number);if(mm===2&&dd===29&&!leapY(y))dd=28;return `${y}-${pad(mm)}-${pad(dd)}`}
const bdOn=(b,date)=>(!b.year||+date.slice(0,4)>=b.year)&&bdDate(b,+date.slice(0,4))===date;
function bdNext(b,t){const y=+t.slice(0,4);let d=bdDate(b,y);if(d<t)d=bdDate(b,y+1);return d}
function bdEntry(b,date){
  const age=b.year?+date.slice(0,4)-b.year:0;
  return {kind:'bday',id:b.id,title:'ДР: '+b.name+(age>0?' · '+age:''),time:'',date,color:'#e86fa8',done:false,note:b.note||''};
}
const bdSorted=()=>{const t=today();return S.bdays.map(b=>{const d=bdNext(b,t);return {b,d,n:diffDays(t,d)}}).sort((x,y)=>x.n-y.n||x.b.name.localeCompare(y.b.name))};
const bdWhen=n=>n===0?'сегодня!':n===1?'завтра':'через '+n+' '+plural(n,'день','дня','дней');
function bdRender(){
  const l=bdSorted();
  if(!l.length)return `<div class="empty"><b>Дней рождения пока нет.</b><br>Нажми «+» в заголовке: имя, дата и заметка. В этот день каждый год в календаре появится запись.</div>`;
  return l.map(({b,d,n})=>{
    const age=b.year?+d.slice(0,4)-b.year:0;
    return `<button class="bdrow${n===0?' today':n<=7?' soon':''}" data-act="bdEdit" data-id="${b.id}">
      <span class="bdn"><b>${esc(b.name)}</b><small>${fmtLong(d)}${age>0?' · исполнится '+age:''}</small>${b.note?`<small class="bdnote">${esc(b.note)}</small>`:''}</span>
      <span class="bdw">${bdWhen(n)}</span></button>`;
  }).join('');
}
TILES.push({id:'bday',title:'Дни рождения',
  headExtra:()=>`<button class="ic" data-act="bdNew" aria-label="Добавить день рождения" title="Добавить">${ic('plus',15,2)}</button>`,
  meta:()=>{const l=bdSorted();return l.length?l[0].b.name+' · '+bdWhen(l[0].n):''},render:bdRender});
acts.bdNew=()=>openModal({type:'bday',id:null});
acts.bdEdit=el=>openModal({type:'bday',id:el.dataset.id});
MODALS.bday=m=>{
  const b=m.id?S.bdays.find(x=>x.id===m.id):null;
  if(m.id&&!b)return '<h3>Не найдено</h3>';
  const fid='bd';
  const mo=ui.drafts['bd-mo']||(b?String(+b.md.slice(0,2)):String(+today().slice(5,7)));
  return `<h3>${b?'День рождения':'Новый день рождения'}</h3>
  <form id="${fid}" data-submit="saveBday" data-id="${b?b.id:''}" style="display:flex;flex-direction:column;gap:12px">
    <label class="l">Имя${fld(fid,'name',{ph:'Например: Мама',req:1,af:1,value:b?b.name:''})}</label>
    <div class="fr fr3"><label class="l">День${fld(fid,'day',{type:'number',req:1,attrs:'min="1" max="31"',value:b?String(+b.md.slice(3)):''})}</label>
      <label class="l">Месяц<select id="bd-mo" name="mo" data-draft>${MONG.map((n,i)=>`<option value="${i+1}"${String(i+1)===mo?' selected':''}>${n}</option>`).join('')}</select></label>
      <label class="l">Год (необяз.)${fld(fid,'year',{type:'number',attrs:'min="1900" max="2100"',ph:'1990',value:b&&b.year?String(b.year):''})}</label></div>
    <label class="l">Заметка${fld(fid,'note',{type:'textarea',ph:'Например: любит коньяк, подарить…',value:b?b.note||'':''})}</label>
    <div class="fr" style="justify-content:space-between"><span class="fr"><button class="btn primary">${b?'Сохранить':'Добавить'}</button><button type="button" class="btn" data-act="mclose">Отмена</button></span>${b?delBtn('bd-'+b.id,'bdDel','data-id="'+b.id+'"'):''}</div></form>`;
};
forms.saveBday=(f,fd)=>{
  const name=(fd.name||'').trim(),day=+fd.day,mo=+fd.mo,year=fd.year?+fd.year:null;
  if(!name)return;
  const maxd=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1];
  if(!(day>=1&&day<=maxd)){toast('Такой даты нет: в этом месяце дней до '+maxd,1);return}
  const rec={name,md:pad(mo)+'-'+pad(day),year,note:(fd.note||'').trim()};
  const id=f.dataset.id;
  if(id)store.upd('bdays',id,n=>{Object.assign(n,rec)});
  else store.put('bdays',{id:uid(),...rec,created:Date.now()});
  closeModal();
};
acts.bdDel=el=>ask('bd-'+el.dataset.id,()=>{store.del('bdays',el.dataset.id);closeModal()});

/* ===== Плитка «График»: рабочие графики по шаблону (2/2, 5/2…), красят дни в календаре ===== */
const SCHEDPRE=[[2,2],[5,2],[1,3],[3,3],[1,1],[4,2]];
const addMonths=(s,n)=>{const d=pdate(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
function schedOn(g,date){
  const o=g.ovr&&g.ovr[date];
  let on=false;
  if(o&&o.on!==undefined)on=!!o.on;
  else if(g.start&&date>=g.start&&(!g.until||date<=g.until)){const n=diffDays(g.start,date);on=(n%((+g.work||1)+(+g.off||0)))<(+g.work||1)}
  if(!on)return null;
  return {from:(o&&o.from)||g.from||'',to:(o&&o.to)||g.to||'',custom:!!(o&&(o.from||o.to||o.on!==undefined))};
}
const schedTime=r=>r.from&&r.to?r.from+'–'+r.to:r.from||r.to||'';
const schedShort=r=>{const f=x=>(x||'').replace(/:00$/,'');return r.from&&r.to?f(r.from)+'–'+f(r.to):f(r.from||r.to)};
const schedMarks=date=>S.sched.filter(g=>g.show!==false).map(g=>({g,r:schedOn(g,date)})).filter(x=>x.r);
function lumOf(c){const m=/^#([0-9a-f]{6})$/i.exec(c||'');if(!m)return .3;const n=parseInt(m[1],16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}
function schedStyle(date){
  const ms=schedMarks(date);if(!ms.length)return {c:'',s:''};
  const cols=ms.map(x=>x.g.color||'#888');
  const bg=cols.length===1?cols[0]:'conic-gradient('+cols.map((c,i)=>`${c} ${i*100/cols.length}% ${(i+1)*100/cols.length}%`).join(',')+')';
  const fg=cols.reduce((a,c)=>a+lumOf(c),0)/cols.length>0.62?'#1a1a1a':'#fff';
  return {c:' sch',s:` style="--sbg:${bg};--sfg:${fg}"`};
}
function schedRows(date){
  const ms=schedMarks(date);
  return ms.length?`<div class="schrows">${ms.map(({g,r})=>`<div class="schrow" style="--c:${g.color}"><i></i><b>${esc(g.name)}</b><span>${esc(schedTime(r))}</span></div>`).join('')}</div>`:'';
}
/* ---- плитка ---- */
function schedBanners(){
  const t=today();
  return S.sched.filter(g=>g.until&&diffDays(t,g.until)<=7).map(g=>{
    const left=diffDays(t,g.until);
    return `<div class="schban" style="--c:${g.color}"><div>${left<0?'График «'+esc(g.name)+'» закончился':'График «'+esc(g.name)+'» заканчивается'+(left===0?' сегодня':' через '+left+' '+plural(left,'день','дня','дней'))}</div>
      <div class="fr" style="gap:6px;flex-wrap:wrap"><span class="hint">Продлить на</span>${[1,3,6].map(n=>`<button class="btn sm" data-act="schedExt" data-id="${g.id}" data-n="${n}">${n} мес.</button>`).join('')}</div></div>`}).join('');
}
function schedCard(g){
  const t=today(),w=schedOn(g,t);
  return `<div class="schcard" role="button" tabindex="0" style="--c:${g.color}" data-act="schedOpen" data-id="${g.id}">
    <i></i><div class="scn"><b>${esc(g.name)}</b><small>${g.work}/${g.off}${g.from||g.to?' · '+esc(schedTime({from:g.from,to:g.to})):''} · до ${g.until?fmtLong(g.until):'—'}</small>${w?`<small class="scnow">сегодня работа${schedTime(w)?', '+esc(schedTime(w)):''}</small>`:''}</div>
    <button class="btn sm${g.show===false?'':' primary'}" data-act="schedShow" data-id="${g.id}" title="Показывать в календаре">${g.show===false?'Скрыт':'В календаре'}</button></div>`;
}
function schedDetail(g){
  const v=ui.schedMonth||ymOf(today());
  const cell=(d,dn)=>{const r=schedOn(g,d);
    return `<button class="cal-c mini${d===today()?' today':''}" data-act="schedDay" data-id="${g.id}" data-date="${d}"><span class="dn${r?' sch':''}"${r?` style="--sbg:${g.color};--sfg:${lumOf(g.color)>0.62?'#1a1a1a':'#fff'}"`:''}>${dn}</span>${r&&schedTime(r)?`<small class="sct${r.custom?' cu':''}">${esc(schedShort(r))}</small>`:'<small class="sct"></small>'}</button>`};
  const bk='s:sched:'+g.id;
  return `<div class="subwrap" style="--c:${g.color}"><div class="subhead"><b>${esc(g.name)}</b><button class="ic sm" data-act="schedEdit" data-id="${g.id}" aria-label="Изменить график" title="Изменить">${ic('edit',13,2)}</button><span class="sp"></span>${blurBtn(bk,1)}<button class="btn sm" data-act="schedBack">${ic('l',12,2)} Назад</button></div>
    <div class="subbody${blurOn(bk)?' blur':''}"><button class="btn sm${g.show===false?'':' primary'}" data-act="schedShow" data-id="${g.id}" style="align-self:flex-start">${g.show===false?'Не показывать в календаре':'Показывать в календаре'}</button>
    <div class="navbar"><button class="ic sm" data-act="schedNav" data-d="-1" aria-label="Назад">${ic('l',13,2)}</button><b>${monthTitle(v)}</b><button class="ic sm" data-act="schedNav" data-d="1" aria-label="Вперёд">${ic('r',13,2)}</button></div>
    ${calGrid(v,cell)}
    <div class="hint">Нажми на день, чтобы сделать его рабочим или выходным, или поставить другое время. Отмеченные дни: <span class="sct cu">другое время</span></div></div></div>`;
}
function schedRender(m){
  const g=ui.schedSel&&S.sched.find(x=>x.id===ui.schedSel);
  if(m==='f'&&g)return schedDetail(g);
  if(!S.sched.length)return `<div class="empty"><b>Графиков пока нет.</b><br>Нажми «+» в заголовке: например «Моя работа» 2/2 с 10:00 до 19:00. Рабочие дни закрасятся в календаре.</div>`;
  return schedBanners()+S.sched.map(schedCard).join('');
}
TILES.push({id:'sched',title:'График',
  headExtra:()=>`<button class="ic" data-act="schedNew" aria-label="Новый график" title="Новый график">${ic('plus',15,2)}</button>`,
  meta:()=>{const t=today();return S.sched.some(g=>schedOn(g,t))?'сегодня рабочий':''},
  render:schedRender});
acts.schedOpen=el=>{ui.schedSel=el.dataset.id;ui.schedMonth=ymOf(today());if(ui.open!=='sched')ui.open='sched';scheduleRender()};
acts.schedBack=()=>{ui.schedSel=null;scheduleRender()};
acts.schedNav=el=>{ui.schedMonth=ymAdd(ui.schedMonth||ymOf(today()),+el.dataset.d);scheduleRender()};
acts.schedShow=el=>store.upd('sched',el.dataset.id,n=>{n.show=n.show===false});
acts.schedExt=el=>store.upd('sched',el.dataset.id,n=>{const base=n.until&&n.until>today()?n.until:today();n.until=addMonths(base,+el.dataset.n);toast('График продлён до '+fmtLong(n.until))});
/* ---- создание и правка графика ---- */
acts.schedNew=()=>{
  const used=S.sched.map(g=>g.color);
  ui.drafts['sg-color']=PALETTE.find(c=>!used.includes(c))||PALETTE[S.sched.length%PALETTE.length];
  openModal({type:'sched',id:null});
};
acts.schedEdit=el=>{const g=S.sched.find(x=>x.id===el.dataset.id);if(!g)return;ui.drafts['sg-color']=g.color;openModal({type:'sched',id:g.id})};
acts.schedColor=el=>{ui.drafts['sg-color']=el.dataset.c;scheduleRender()};
chg.schedColorPick=el=>{ui.drafts['sg-color']=el.value;scheduleRender()};
acts.schedPre=el=>{ui.drafts['sg-work']=el.dataset.w;ui.drafts['sg-off']=el.dataset.o;scheduleRender()};
MODALS.sched=m=>{
  const g=m.id?S.sched.find(x=>x.id===m.id):null;
  if(m.id&&!g)return '<h3>Не найдено</h3>';
  const fid='sg';const col=ui.drafts['sg-color']||PALETTE[0];
  const w=ui.drafts['sg-work']??(g?g.work:2),o=ui.drafts['sg-off']??(g?g.off:2);
  return `<h3>${g?'График':'Новый график'}</h3>
  <form id="${fid}" data-submit="saveSched" data-id="${g?g.id:''}" style="display:flex;flex-direction:column;gap:12px">
    <label class="l">Название${fld(fid,'name',{ph:'Например: Моя работа',req:1,af:!g,value:g?g.name:''})}</label>
    <div class="l">Цвет${swatches(col,'schedColor')}</div>
    <div class="l">Шаблон<div class="fr" style="gap:6px;flex-wrap:wrap">${SCHEDPRE.map(([a,b])=>`<button type="button" class="btn sm${+w===a&&+o===b?' primary':''}" data-act="schedPre" data-w="${a}" data-o="${b}">${a}/${b}</button>`).join('')}</div></div>
    <div class="fr"><label class="l">Рабочих подряд${fld(fid,'work',{type:'number',req:1,attrs:'min="1" max="30" inputmode="numeric"',value:String(w)})}</label>
      <label class="l">Выходных подряд${fld(fid,'off',{type:'number',req:1,attrs:'min="0" max="30" inputmode="numeric"',value:String(o)})}</label></div>
    <div class="fr"><label class="l">Первый рабочий день${fld(fid,'start',{type:'date',req:1,value:g?g.start:today()})}</label>
      ${g?`<label class="l">Действует до${fld(fid,'until',{type:'date',req:1,value:g.until||''})}</label>`
        :`<label class="l">На сколько месяцев<select id="sg-months" name="months" data-draft>${[1,2,3,6,12].map(n=>`<option value="${n}"${String(ui.drafts['sg-months']||3)===String(n)?' selected':''}>${n}</option>`).join('')}</select></label>`}</div>
    <div class="fr"><div class="l">С${timeFld(fid,'from',g?g.from:'')}</div><div class="l">До${timeFld(fid,'to',g?g.to:'')}</div></div>
    <label class="chkrow"><input type="checkbox" id="sg-show" name="show" data-draft ${(ui.drafts['sg-show']!==undefined?ui.drafts['sg-show']:(g?g.show!==false:true))?'checked':''}> Показывать в календаре</label>
    <div class="fr" style="justify-content:space-between"><span class="fr"><button class="btn primary">${g?'Сохранить':'Создать'}</button><button type="button" class="btn" data-act="mclose">Отмена</button></span>${g?delBtn('sg-'+g.id,'schedDel','data-id="'+g.id+'"'):''}</div></form>`;
};
forms.saveSched=(f,fd)=>{
  const name=(fd.name||'').trim();if(!name)return;
  const work=Math.max(1,+fd.work||1),off=Math.max(0,+fd.off||0);
  if(!fd.start){toast('Нужна дата первого рабочего дня',1);return}
  const id=f.dataset.id;
  const until=fd.until||addDays(addMonths(fd.start,+fd.months||3),-1);
  const rec={name,color:ui.drafts['sg-color']||PALETTE[0],work,off,start:fd.start,until,from:fd.from||'',to:fd.to||'',show:!!fd.show};
  if(id)store.upd('sched',id,n=>{Object.assign(n,rec)});
  else{const ni={id:uid(),...rec,ovr:{},created:Date.now()};store.put('sched',ni);ui.schedSel=ni.id;ui.schedMonth=fd.start.slice(0,7)}
  clearDrafts('sg');closeModal();
};
acts.schedDel=el=>ask('sg-'+el.dataset.id,()=>{store.del('sched',el.dataset.id);if(ui.schedSel===el.dataset.id)ui.schedSel=null;clearDrafts('sg');closeModal()});
/* ---- отдельный день ---- */
acts.schedDay=el=>{

/* ===== Плитка «Цикл»: отметки месячных, прогноз и овуляция. Ни с чем, кроме синхронизации устройств, не связана ===== */
const CYC_SYM=['Боль','Усталость','Головная боль','Настроение','Тошнота','Вздутие'];
const cycSet=()=>{const p=S.prefs.find(x=>x.id==='cycset');return Object.assign({cycle:28,plen:5,auto:true,on:''},p||{})};
const cycAvg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
function cycModel(){
  const st=cycSet(),t=today();
  const stored=new Set(S.cyc.map(x=>x.date));
  const days=new Set(stored);const virt=new Set();
  if(st.on&&st.on<=t){for(let d=st.on,g=0;d<=t&&g<60;d=addDays(d,1),g++){if(!days.has(d))virt.add(d);days.add(d)}}
  const sorted=[...days].sort();
  const periods=[];
  sorted.forEach(d=>{const l=periods[periods.length-1];if(l&&diffDays(l.e,d)===1)l.e=d;else periods.push({s:d,e:d})});
  periods.forEach(p=>{p.len=diffDays(p.s,p.e)+1});
  const lens=[];for(let i=1;i<periods.length;i++){const n=diffDays(periods[i-1].s,periods[i].s);if(n>=15&&n<=60)lens.push(n)}
  const ended=periods.filter(p=>!(st.on&&p.s<=st.on&&p.e>=st.on));
  const cycle=st.auto&&lens.length?cycAvg(lens.slice(-6)):st.cycle;
  const plen=st.auto&&ended.length?Math.min(10,Math.max(2,cycAvg(ended.slice(-6).map(p=>p.len)))):st.plen;
  const preds=[],predDays=new Set(),fert=new Set(),ovu=new Set();
  if(periods.length){
    const last=periods[periods.length-1];
    for(let k=1;k<=4;k++){
      const s=addDays(last.s,cycle*k),e=addDays(s,plen-1);
      preds.push({s,e});
      for(let d=s,g=0;d<=e&&g<12;d=addDays(d,1),g++)predDays.add(d);
      const o=addDays(s,-14);ovu.add(o);
      for(let i=-5;i<=1;i++)fert.add(addDays(o,i));
    }
  }
  return {st,days,virt,stored,periods,cycle,plen,preds,predDays,fert,ovu,lens};
}
function cycHead(M){
  const t=today(),st=M.st;
  if(st.on&&st.on<=t){const n=diffDays(st.on,t)+1;return `Идут месячные, день ${n}<small>с ${fmtLong(st.on)}</small>`}
  if(!M.preds.length)return 'Отметь первый день месячных<small>Дальше появятся прогноз и овуляция</small>';
  let nx=M.preds.find(p=>p.s>=t);
  if(!nx){const p0=M.preds[0];return `Задержка ${diffDays(p0.s,t)} ${plural(diffDays(p0.s,t),'день','дня','дней')}<small>ожидались ${fmtLong(p0.s)}</small>`}
  const n=diffDays(t,nx.s);
  return n===0?`Ожидаются сегодня<small>${fmtLong(nx.s)}</small>`:`Следующие через ${n} ${plural(n,'день','дня','дней')}<small>ожидаются ${fmtLong(nx.s)}</small>`;
}
function cycRender(){
  const M=cycModel(),t=today(),v=ui.cycMonth||ymOf(t),sel=ui.cycSel||t;
  const cell=(d,dn)=>{
    let c='';
    if(M.days.has(d))c=' cp';else if(M.predDays.has(d))c=' cq';else if(M.ovu.has(d))c=' co';else if(M.fert.has(d))c=' cf';
    const hasN=S.cycn.some(n=>n.date===d&&(n.text||(n.sym||[]).length));
    return `<button class="cal-c mini cyc${c}${d===t?' today':''}${d===sel?' sel':''}" data-act="cycPick" data-date="${d}"><span class="dn">${dn}</span>${hasN?'<i></i>':''}</button>`;
  };
  const ongoing=!!(M.st.on&&M.st.on<=t);
  const periodsRev=[...M.periods].reverse().slice(0,8).map(p=>{
    const idx=M.periods.indexOf(p),nx=M.periods[idx+1];
    const cyc=nx?diffDays(p.s,nx.s):0;
    return `<div class="cyrow"><b>${fmtShort(p.s)}${p.e!==p.s?' – '+fmtShort(p.e):''}</b><span>${p.len} ${plural(p.len,'день','дня','дней')}</span><span class="dim">${cyc?'цикл '+cyc+' дн.':'идёт'}</span></div>`}).join('');
  const nt=S.cycn.find(n=>n.date===sel)||{};
  const inP=M.days.has(sel),virt=M.virt.has(sel);
  const kind=inP?'Месячные':M.predDays.has(sel)?'Ожидаются месячные':M.ovu.has(sel)?'Овуляция (по расчёту)':M.fert.has(sel)?'Окно зачатия (по расчёту)':'';
  return `<div class="cyhead">${cycHead(M)}</div>
  <div class="fr cybtns"><button class="btn primary" data-act="${ongoing?'cycEnd':'cycStart'}">${ongoing?'Закончились':'Начались'}</button><button class="btn sm" data-act="cycSettings" aria-label="Настройки цикла">Настройки</button></div>
  <div class="navbar"><button class="ic sm" data-act="cycNav" data-d="-1" aria-label="Назад">${ic('l',13,2)}</button><b>${monthTitle(v)}</b><button class="ic sm" data-act="cycNav" data-d="1" aria-label="Вперёд">${ic('r',13,2)}</button></div>
  ${calGrid(v,cell)}
  <div class="cylegend"><span><i class="lp"></i>месячные</span><span><i class="lq"></i>прогноз</span><span><i class="lf"></i>окно</span><span><i class="lo"></i>овуляция</span></div>
  <div class="cyday"><div class="cyt"><b>${fmtLong(sel)}</b><span class="dim">${kind}</span></div>
    ${virt?`<div class="hint">Месячные идут. Дни отметятся, когда нажмёшь «Закончились».</div>`:`<button class="btn sm${inP?'':' primary'}" data-act="cycToggle">${inP?'Снять отметку месячных':'Отметить как месячные'}</button>`}
    <div class="fr" style="gap:6px;flex-wrap:wrap">${CYC_SYM.map(s=>`<button class="btn sm${(nt.sym||[]).includes(s)?' primary':''}" data-act="cycSym" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <textarea id="cy-note-${sel}" rows="2" placeholder="Заметка на день" data-chg="cycNote" data-date="${sel}">${esc(nt.text||'')}</textarea></div>
  <div class="cystat">Средний цикл: <b>${M.cycle}</b> дн. · месячные: <b>${M.plen}</b> дн.${M.st.auto&&M.lens.length?'':' (по умолчанию)'}</div>
  ${periodsRev?`<div class="cyhist"><div class="hint">Прошлые циклы</div>${periodsRev}</div>`:''}`;
}

    try{
      let blob;
      if(STANDALONE){const r=await idb.get(f.id);blob=r&&r.blob}
      else{const r=await fetch('/_blob/'+f.id);if(r.ok)blob=await r.blob()}
      if(!blob){miss++;continue}
      out[f.id]={name:f.name,type:f.type||blob.type,url:await b64(blob)};
    }catch(e){miss++}
  }
  return {files:out,miss};
}

/* ===== Синхронизация между устройствами (Firebase, REST) — только вне Claude ===== */
const FB={key:'AIzaSyCxt5LlcRueP0jIyBMJTlYw09QOP1YbliI',project:'plane-39479'};
const FSDOC=`projects/${FB.project}/databases/(default)/documents`;
const FSURL='https://firestore.googleapis.com/v1/'+FSDOC;
const SYNC={
  on:false,tok:'',exp:0,rt:'',email:'',uid:'',migrated:false,lbl:'',last:0,u:{},q:{},inited:false,busy:false,again:false,
  status:'',err:'',at:0,pt:null,tooBig:{},
  save(){try{localStorage.setItem('planner.sync',JSON.stringify({rt:this.rt,email:this.email,uid:this.uid,migrated:this.migrated,last:this.last,u:this.u,q:this.q,inited:this.inited}))}catch(e){}},
  load(){try{const s=JSON.parse(localStorage.getItem('planner.sync')||'{}');Object.assign(this,{rt:s.rt||'',email:s.email||'',uid:s.uid||'',migrated:!!s.migrated,last:s.last||0,u:s.u||{},q:s.q||{},inited:!!s.inited});if(this.rt&&!this.uid){this.last=0;this.u={};this.inited=false;this.migrated=false}}catch(e){}},
  nextU(){const n=Math.max(Date.now(),this.last+1);this.last=n;return n},
  authErr(m,up){
    if(/OPERATION_NOT_ALLOWED/.test(m))return 'В Firebase не включён вход по почте и паролю';
    if(/EMAIL_EXISTS/.test(m))return 'Такая почта уже зарегистрирована, нажми «Войти»';
    if(/WEAK_PASSWORD/.test(m))return 'Пароль слишком простой (минимум 6 символов)';
    if(/INVALID_EMAIL/.test(m))return 'Проверь написание почты';
    if(/EMAIL_NOT_FOUND/.test(m))return 'Такой почты нет, нажми «Регистрация»';
    if(/INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(m))return 'Неверная почта или пароль';
    if(/TOO_MANY/.test(m))return 'Слишком много попыток, подожди несколько минут';
    return 'Ошибка: '+m;
  },
  async auth(kind,email,pw){
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+kind+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
    const j=await r.json();
    if(!r.ok)throw new Error(this.authErr((j.error&&j.error.message)||''));
    const last=localStorage.getItem('planner.lastuid');
    if(last&&last!==j.localId)this.wipeLocal();
    try{localStorage.setItem('planner.lastuid',j.localId)}catch(e){}
    this.tok=j.idToken;this.exp=Date.now()+(+j.expiresIn)*1000;this.rt=j.refreshToken;this.email=email;this.uid=j.localId;
    this.inited=false;this.migrated=false;this.last=0;this.u={};this.q={};this.save();
  },
  login(email,pw){return this.auth('signInWithPassword',email,pw)},
  signup(email,pw){return this.auth('signUp',email,pw)},
  async reset(email){
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestType:'PASSWORD_RESET',email})});
    const j=await r.json();if(!r.ok)throw new Error(this.authErr((j.error&&j.error.message)||''));
  },
  wipeLocal(){COLL.forEach(c=>{S[c]=[];try{localStorage.removeItem('planner.'+c)}catch(e){}});scheduleRender()},
  async token(){
    if(this.tok&&Date.now()<this.exp-60000)return this.tok;
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(this.rt)});
    const j=await r.json();
    if(!r.ok){if(r.status===400||r.status===401){this.rt='';this.on=false;this.save();this.status='out';scheduleRender()}throw new Error('auth')}
    this.tok=j.id_token;this.exp=Date.now()+(+j.expires_in)*1000;this.rt=j.refresh_token||this.rt;this.uid=j.user_id||this.uid;try{if(this.uid&&!localStorage.getItem('planner.lastuid'))localStorage.setItem('planner.lastuid',this.uid)}catch(e){}this.save();return this.tok;
  },
  async api(url,body){
    const go=async()=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await this.token()},body:JSON.stringify(body)});
    let r=await go();
    if(r.status===401){this.tok='';r=await go()}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    return j;
  },
  start(){
    if(!STANDALONE||!this.rt)return;
    this.on=true;this.status='ok';
    this.run();
    clearInterval(this.pt);this.pt=setInterval(()=>{if(!document.hidden)this.run()},10000);
  },
  base(){return FSURL+'/users/'+this.uid},
  mark(c,id){
    if(!this.on||!this.rt)return;
    this.q[c+'_'+id]=1;this.save();
    clearTimeout(this.dt);this.dt=setTimeout(()=>this.run(),700);
  },
  async run(){
    if(!this.on)return;
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{
      if(!navigator.onLine)throw new Error('offline');
      await this.token();
      const first=this.last===0;
      await this.pull();
      if(!this.migrated){if(first&&this.last===0)await this.migrateOld();this.migrated=true;this.save()}
      if(!this.inited)await this.firstMerge();
      await this.push();
      this.status='ok';this.err='';this.at=Date.now();
    }catch(e){
      this.status=navigator.onLine?'err':'offline';this.err=(e&&e.message)||'';
    }
    this.busy=false;
    const lb=this.label();if(lb!==this.lbl){this.lbl=lb;if(ui.modal&&(ui.modal.type==='settings'||ui.modal.type==='syncInfo'))scheduleRender()}
    if(this.again){this.again=false;setTimeout(()=>this.run(),300)}
  },
  async pull(){
    let changed=false;
    for(let guard=0;guard<200;guard++){
      const res=await this.api(this.base()+':runQuery',{structuredQuery:{from:[{collectionId:'items'}],
        where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(this.last)}}},
        orderBy:[{field:{fieldPath:'u'}}],limit:100}});
      const docs=res.filter(x=>x.document).map(x=>x.document);
      for(const d of docs){
        const f=d.fields||{};const key=d.name.split('/').pop();const u=+(f.u&&f.u.integerValue||0);
        this.last=Math.max(this.last,u);
        if(u<=(this.u[key]||0))continue;
        if(this.q[key]){this.u[key]=u;continue}
        const c=f.c&&f.c.stringValue,id=f.id&&f.id.stringValue,del=!!(f.d&&f.d.booleanValue),j=f.j&&f.j.stringValue;
        this.u[key]=u;
        if(await this.apply(c,id,del,j))changed=true;
      }
      this.save();
      if(docs.length<100)break;
    }
    if(changed)scheduleRender();
  },
  async migrateOld(){
    /* перенос данных из старого общего раздела (доступен только владельцу) */
    try{
      for(let g=0;g<50;g++){
        const res=await this.api(FSURL+':runQuery',{structuredQuery:{from:[{collectionId:'items'}],limit:100,offset:g*100}});
        const docs=res.filter(x=>x.document).map(x=>x.document);
        for(const d of docs){
          const f=d.fields||{};const key=d.name.split('/').pop();
          const c=f.c&&f.c.stringValue,id=f.id&&f.id.stringValue,del=!!(f.d&&f.d.booleanValue),j=f.j&&f.j.stringValue;
          if(del||this.q[key])continue;
          if(await this.apply(c,id,del,j))scheduleRender();
          this.q[key]=1;
        }
        if(docs.length<100)break;
      }
    }catch(e){}
  },
  async apply(c,id,del,j){
    if(c==='_file'){
      if(del)return false;
      try{if(blobMap[id])return false;const o=JSON.parse(j);const blob=await (await fetch(o.data)).blob();
        await idb.put({id,name:o.name,type:o.type,blob});blobMap[id]=URL.createObjectURL(blob);return true}catch(e){return false}
    }
    if(!COLL.includes(c))return false;
    if(del){const n=S[c].length;S[c]=S[c].filter(x=>x.id!==id);store.saveLocal(c);return S[c].length!==n}
    try{const it=JSON.parse(j);const i=S[c].findIndex(x=>x.id===id);if(i<0)S[c].push(it);else S[c][i]=it;store.saveLocal(c);return true}catch(e){return false}
  },
  async firstMerge(){
    COLL.forEach(c=>S[c].forEach(it=>{const k=c+'_'+it.id;if(!(k in this.u))this.q[k]=1}));
    try{(await idb.all()||[]).forEach(r=>{const k='_file_'+r.id;if(!(k in this.u))this.q[k]=1})}catch(e){}
    this.inited=true;this.save();
  },
  async fileDoc(id){
    const r=await idb.get(id);if(!r)return null;
    let blob=r.blob;const lim=700000;
    if(blob.size>lim&&/^image\//.test(blob.type)){
      try{const bm=await createImageBitmap(blob);
        for(const [dim,q] of [[1800,.78],[1400,.7],[1000,.62],[800,.55]]){
          const k=Math.min(1,dim/Math.max(bm.width,bm.height));const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
          cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
          const b=await new Promise(res=>cv.toBlob(res,'image/jpeg',q));if(b&&b.size<=lim){blob=b;break}
        }}catch(e){}
    }
    if(blob.size>lim){if(!this.tooBig[id]){this.tooBig[id]=1;toast('Файл «'+r.name+'» слишком большой для синхронизации (больше 700 КБ)',1)}return null}
    const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
    return JSON.stringify({name:r.name,type:blob.type||r.type,data});
  },
  async push(){
    for(let guard=0;guard<100;guard++){
      const keys=Object.keys(this.q).slice(0,40);if(!keys.length)break;
      const writes=[],sent=[];
      for(const key of keys){
        const p=key.indexOf('_',key[0]==='_'?1:0);const c=key.slice(0,p),id=key.slice(p+1);
        let j='',del=false;
        if(c==='_file'){j=await this.fileDoc(id);if(j===null){delete this.q[key];continue}}
        else{const it=(S[c]||[]).find(x=>x.id===id);if(it)j=JSON.stringify(it);else del=true}
        const u=this.nextU();sent.push([key,u]);
        writes.push({update:{name:FSDOC+'/users/'+this.uid+'/items/'+key,fields:{c:{stringValue:c},id:{stringValue:id},j:{stringValue:del?'':j},u:{integerValue:String(u)},d:{booleanValue:del}}}});
      }
      if(writes.length){await this.api(FSURL+':commit',{writes});sent.forEach(([k,u])=>{this.u[k]=u;delete this.q[k]})}
      this.save();
    }
  },
  logout(){this.on=false;clearInterval(this.pt);this.tok='';this.rt='';this.uid='';this.inited=false;this.migrated=false;this.last=0;this.u={};this.q={};this.save();this.status='';scheduleRender()},
  label(){
    if(!STANDALONE)return 'доступна только в версии вне Claude';
    if(!this.rt)return 'не подключена';
    if(this.status==='err')return 'ошибка: '+esc(this.err);
    if(this.status==='offline')return 'нет сети, догоним позже';
    if(Object.keys(this.q).length)return 'отправляю…';
    return 'включена · '+esc(this.email);
  }
};
